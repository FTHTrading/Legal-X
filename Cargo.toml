[workspace]
members = [
    "crates/citation-verifier",
    "crates/authority-router",
    "crates/fre902-proof-engine",
    "crates/state-machine",
    "crates/x402-settlement"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Legal-X Core Architecture Team <dev@unykorn.ai>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/FTHTrading/Legal-X"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
blake2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
