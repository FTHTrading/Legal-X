name = "legal-chain-portal"
main = "infra/cloudflare/worker.js"
compatibility_date = "2026-08-01"

routes = [
  { pattern = "legacychain.app/*", zone_name = "legacychain.app" },
  { pattern = "www.legacychain.app/*", zone_name = "legacychain.app" },
  { pattern = "app.legacychain.app/*", zone_name = "legacychain.app" },
  { pattern = "vault.legacychain.app/*", zone_name = "legacychain.app" }
]

[assets]
directory = "./site"
binding = "ASSETS"
